<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor Brasil</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--txt:#e6edf3;--mut:#8b949e;
--verde:#3fb950;--verm:#f85149;--azul:#58a6ff;--amar:#d29922;--cinza:#6e7681}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px;border-bottom:1px solid var(--line)}
h1{margin:0 0 6px;font-size:20px;font-weight:600}
h2{font-size:16px;margin:28px 0 12px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--mut);font-size:13px}
.meta b{color:var(--txt);font-weight:500}
main{max-width:1280px;margin:0 auto;padding:0 16px 40px}
.filtros{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
.filtros button{background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:16px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
.filtros button.on{color:var(--txt);border-color:var(--azul)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:190px}
.card:hover{border-color:var(--mut)}
.nome{font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:6px}
.valor{font-size:24px;font-weight:600}
.valor small{font-size:13px;color:var(--mut);font-weight:400;margin-left:4px}
.var{font-size:13px;font-weight:500}
.melhora{color:var(--verde)}.piora{color:var(--verm)}.neutro,.estavel,.sem_base{color:var(--azul)}
.ref{font-size:12px;color:var(--mut)}
.ref a{color:var(--azul);text-decoration:none}
.selo{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid;white-space:nowrap;height:fit-content}
.s-atraso{color:var(--amar);border-color:var(--amar)}.s-valid{color:var(--cinza);border-color:var(--cinza)}.s-man{color:var(--azul);border-color:var(--azul)}
.vazio{color:var(--mut);font-style:italic;margin:auto 0}
.spark{height:42px!important;margin-top:auto}
.pill{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.verde{background:var(--verde)}.amarelo{background:var(--amar)}.vermelho{background:var(--verm)}.cinza{background:var(--cinza)}
.painel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500}
.rel{max-width:900px}
.rel table{margin:8px 0}
.rel a{color:var(--azul)}
select{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
.alerta{color:var(--verm);margin:4px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal.on{display:flex}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:10px;width:min(960px,100%);padding:18px}
#modal .topo{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:10px}
#fechar{background:none;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:4px 10px;cursor:pointer}
.chartbox{position:relative;height:360px}
footer{color:var(--mut);font-size:12px;text-align:center;padding:24px 16px;border-top:1px solid var(--line)}
@media(max-width:600px){.valor{font-size:20px}.chartbox{height:260px}}
</style>
</head>
<body>
<header>
  <h1>Monitor de indicadores econômicos e sociais do Brasil</h1>
  <div class="meta" id="meta"></div>
</header>
<main>
  <div class="filtros" id="filtros"></div>
  <div class="grid" id="grid"></div>

  <h2>Relatório semanal</h2>
  <div class="painel">
    <label for="selRel">Edição: </label><select id="selRel"></select>
    <div class="rel" id="relatorio"></div>
  </div>

  <h2>Saúde do sistema</h2>
  <div class="painel" id="saude"></div>
</main>
<div id="modal" role="dialog" aria-modal="true">
  <div class="box">
    <div class="topo"><div><div class="nome" id="mNome"></div><div class="ref" id="mRef"></div></div>
      <button id="fechar" type="button">Fechar</button></div>
    <div class="chartbox"><canvas id="mChart"></canvas></div>
  </div>
</div>
<footer>Valores exibidos exatamente como publicados pelas fontes oficiais. Nenhum dado é estimado.</footer>

<script>
const DADOS = /*__DADOS__*/null;
const EIXOS = ["Todos","Custo de vida","Câmbio","Juros","Fiscal","Trabalho","Social","Atividade","Expectativas","Mercado","Meio ambiente"];
let filtro = "Todos", grafico = null;

function esc(s){return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function urlSegura(u){return /^https:\/\//i.test(u||"") ? u : "#";}
function dataBR(iso){return iso && iso.length>=10 ? iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4) : (iso||"");}
function casas(un,v){if(un==="vagas")return 0; if(un==="índice"&&Math.abs(v)<10)return 3; if(un==="R$"&&Math.abs(v)<20)return 4; return 2;}
function fmt(v,c){return v==null ? "n/d" : v.toLocaleString("pt-BR",{minimumFractionDigits:c,maximumFractionDigits:c});}
function fmtVar(v,t){return v==null ? "sem linha de base" : (v>0?"+":"")+fmt(v,2)+(t==="pp"?" p.p.":"%")+" vs. linha de base";}

function cabecalho(){
  const s = DADOS.saude || {};
  const st = s.status_geral || "cinza";
  const nomes = {verde:"Operacional",amarelo:"Atenção",vermelho:"Crítico",cinza:"Sem dados"};
  document.getElementById("meta").innerHTML =
    `<span>Linha de base: <b>${dataBR(DADOS.baseline_data)}</b></span>`+
    `<span>Última coleta: <b>${dataBR(DADOS.ultima_coleta)||"nenhuma"}</b></span>`+
    `<span>Coletas realizadas: <b>${DADOS.total_coletas}</b></span>`+
    `<span><span class="pill ${esc(st)}"></span>Status: <b>${nomes[st]||st}</b></span>`;
}

function filtros(){
  const el = document.getElementById("filtros");
  el.innerHTML = EIXOS.map(e=>`<button type="button" data-eixo="${esc(e)}" class="${e===filtro?"on":""}">${esc(e)}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{filtro=b.dataset.eixo; filtros(); cartoes();});
}

function cartoes(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  Object.entries(DADOS.indicadores).forEach(([id,ind])=>{
    if(filtro!=="Todos" && ind.eixo!==filtro) return;
    const r = DADOS.resumo[id];
    const c = document.createElement("div");
    c.className = "card"; c.tabIndex = 0;
    let selos = "";
    if(r.atrasado) selos += `<span class="selo s-atraso">dado atrasado</span>`;
    if(!ind.ativo) selos += `<span class="selo s-valid" title="${esc(ind.validar||"")}">coletor desativado</span>`;
    if(r.atual && r.atual.origem) selos += `<span class="selo s-man" title="${esc(r.atual.origem)}">${esc(r.atual.origem.split(" ")[0])}</span>`;
    let corpo;
    if(!r.atual){
      corpo = `<div class="vazio">Aguardando dado</div>`;
    } else {
      const alvo = r.atual.alvo ? ` · ano-alvo ${esc(r.atual.alvo)}` : "";
      corpo = `<div class="valor">${fmt(r.atual.valor,casas(ind.un,r.atual.valor))}<small>${esc(ind.un)}</small></div>`+
        `<div class="var ${esc(r.direcao)}">${fmtVar(r.var_baseline,r.unidade_var)}</div>`+
        `<div class="ref">Ref. ${dataBR(r.atual.ref)}${alvo} · <a href="${esc(urlSegura(r.atual.url))}" target="_blank" rel="noopener">${esc(ind.fonte)}</a></div>`+
        `<canvas class="spark"></canvas>`;
    }
    c.innerHTML = `<div class="nome"><span>${esc(ind.nome)}</span><span>${selos}</span></div>${corpo}`;
    c.querySelectorAll("a").forEach(a=>a.addEventListener("click",ev=>ev.stopPropagation()));
    c.onclick = ()=>abrir(id);
    c.onkeydown = ev=>{if(ev.key==="Enter")abrir(id);};
    grid.appendChild(c);
    if(r.atual && window.Chart){
      const cor = {melhora:"#3fb950",piora:"#f85149"}[r.direcao] || "#58a6ff";
      new Chart(c.querySelector("canvas"),{type:"line",
        data:{labels:ind.serie.map(p=>p.ref),datasets:[{data:ind.serie.map(p=>p.valor),borderColor:cor,borderWidth:1.5,pointRadius:0,tension:.2}]},
        options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false},tooltip:{enabled:false}},
          scales:{x:{display:false},y:{display:false}}}});
    }
  });
}

function abrir(id){
  const ind = DADOS.indicadores[id], r = DADOS.resumo[id];
  document.getElementById("mNome").textContent = `${ind.nome} (${ind.un})`;
  document.getElementById("mRef").textContent = r.baseline
    ? `Linha de base: ${fmt(r.baseline.valor,casas(ind.un,r.baseline.valor))} (ref. ${dataBR(r.baseline.ref)}) · ${ind.fonte}`
    : `Linha de base ainda não travada · ${ind.fonte}`;
  document.getElementById("modal").classList.add("on");
  if(!window.Chart) return;
  if(grafico) grafico.destroy();
  const ds = [{label:ind.nome,data:ind.serie.map(p=>p.valor),borderColor:"#58a6ff",backgroundColor:"#58a6ff",borderWidth:2,pointRadius:ind.serie.length>60?0:2,tension:.2}];
  if(r.baseline) ds.push({label:"Linha de base",data:ind.serie.map(()=>r.baseline.valor),borderColor:"#d29922",borderDash:[6,4],borderWidth:1.5,pointRadius:0});
  grafico = new Chart(document.getElementById("mChart"),{type:"line",data:{labels:ind.serie.map(p=>dataBR(p.ref)),datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{labels:{color:"#8b949e"}},tooltip:{callbacks:{label:t=>`${t.dataset.label}: ${fmt(t.parsed.y,casas(ind.un,t.parsed.y))}`}}},
      scales:{x:{ticks:{color:"#8b949e",maxTicksLimit:10},grid:{color:"#21262d"}},y:{ticks:{color:"#8b949e"},grid:{color:"#21262d"}}}}});
}
function fechar(){document.getElementById("modal").classList.remove("on");}

function relatorios(){
  const sel = document.getElementById("selRel"), lista = DADOS.relatorios || [];
  if(!lista.length){document.getElementById("relatorio").innerHTML = "<p>Nenhum relatório gerado ainda.</p>"; sel.style.display="none"; return;}
  sel.innerHTML = lista.map((r,i)=>`<option value="${i}">${dataBR(r.data)}</option>`).join("");
  const mostrar = i=>{
    const md = lista[i].md, el = document.getElementById("relatorio");
    if(window.marked && window.DOMPurify){el.innerHTML = DOMPurify.sanitize(marked.parse(md));}
    else {el.innerHTML = `<pre style="white-space:pre-wrap">${esc(md)}</pre>`;}
  };
  sel.onchange = ()=>mostrar(+sel.value);
  mostrar(0);
}

function saude(){
  const s = DADOS.saude || {}, el = document.getElementById("saude");
  let h = "";
  (s.integridade||[]).forEach(a=>h += `<div class="alerta">${esc(a)}</div>`);
  const fontes = Object.entries(s.fontes||{});
  if(fontes.length) h += `<p>${fontes.map(([f,st])=>`<span style="margin-right:18px;white-space:nowrap"><span class="pill ${esc(st)}"></span>${esc(f)}</span>`).join("")}</p>`;
  const linhas = Object.entries(s.indicadores||{}).map(([id,x])=>
    `<tr><td><span class="pill ${esc(x.status)}"></span>${esc(DADOS.indicadores[id]?.nome||id)}</td><td>${dataBR(x.ultima_coleta_ok)||"-"}</td>`+
    `<td>${dataBR(x.ultimo_dado_novo)||"-"}</td><td>${dataBR(x.ultima_ref)||"-"}</td><td>${x.falhas_consecutivas||0}</td>`+
    `<td>${esc(x.ultimo_erro||(x.atrasado?"dado atrasado":""))}</td></tr>`).join("");
  h += `<table><thead><tr><th>Indicador</th><th>Última coleta OK</th><th>Último dado novo</th><th>Última ref.</th><th>Falhas seguidas</th><th>Observação</th></tr></thead><tbody>${linhas||'<tr><td colspan="6">Sem execuções registradas.</td></tr>'}</tbody></table>`;
  const q = DADOS.quarentena || [];
  if(q.length) h += `<h2>Quarentena (${q.length})</h2><table><thead><tr><th>Indicador</th><th>Ref.</th><th>Valor</th><th>Motivo</th><th>Coleta</th></tr></thead><tbody>`+
    q.slice(-30).reverse().map(x=>`<tr><td>${esc(x.id)}</td><td>${dataBR(x.ref)}</td><td>${esc(x.valor)}</td><td>${esc(x.motivo)}</td><td>${dataBR(x.coleta)}</td></tr>`).join("")+`</tbody></table>`;
  el.innerHTML = h;
}

document.getElementById("fechar").onclick = fechar;
document.getElementById("modal").onclick = ev=>{if(ev.target.id==="modal")fechar();};
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")fechar();});
if(DADOS){cabecalho(); filtros(); cartoes(); relatorios(); saude();}
else document.getElementById("grid").textContent = "Dados não embutidos: rode dashboard.py.";
</script>
</body>
</html>
